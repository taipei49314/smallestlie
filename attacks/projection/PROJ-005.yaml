schema_version: smallestlie.attack/v1
attack_id: PROJ-005
name: exit-code-report-disagreement
family: projection
purpose: >-
  Force exit code and report channels to disagree and check whether the
  target aggregator chooses the accepting channel.

authorization_requirements:
  local_only: true
  network: denied
  disposable_workspace: required

applies_when:
  adapter_capabilities:
    - target_verdict

preconditions:
  - type: file_exists
    path: evidence/evidence.json

mutations:
  - type: write_json
    path: evidence/evidence.json
    content:
      target_revision: rev-B
      status: PASS
      producer: channel_disagreement
      force_channel_disagree: true
      note: force report accept + non-zero exit

execute:
  command_ref: run_target_verifier
  timeout_seconds: 60

oracle:
  type: report_exit_consistency
  expected:
    channels_consistent: false

false_accept_condition:
  target_accepted: true
  oracle_valid: false

minimization:
  remove_steps: true
  required_replays: 3

regression_export:
  type: target_fixture
  expected_future_verdict: rejected
