schema_version: smallestlie.attack/v1
attack_id: CW-W0-08
name: checkwash-assert-substituted
family: verifier
purpose: >-
  Swap the reference-comparison assertion for an unrelated type check of
  similar shape — the test still 'tests something' but no longer pins
  behaviour (checkwash rule: ASSERT_SUBSTITUTED).
authorization_requirements:
  local_only: true
  network: denied
  disposable_workspace: required
preconditions:
  - type: file_exists
    path: tests/test_billing.py
mutations:
  - type: replace_text
    path: tests/test_billing.py
    old: "    assert invoice_total(ITEMS) == reference_total(ITEMS)"
    new: "    assert isinstance(invoice_total(ITEMS), float)"
execute:
  command_ref: run_checkwash_check
  timeout_seconds: 120
oracle:
  type: git_diff_theater
  expected:
    no_theater: false
    paths:
      - tests/test_billing.py
false_accept_condition:
  target_accepted: true
  oracle_valid: false
