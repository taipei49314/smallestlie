schema_version: smallestlie.attack/v1
attack_id: SEM-001
name: pass-fail-inversion
family: semantic
purpose: >-
  Invert internal interpretation of result tokens so FAIL is treated as accept.

authorization_requirements:
  local_only: true
  network: denied
  disposable_workspace: required

preconditions:
  - type: file_exists
    path: config/semantics.yaml

mutations:
  - type: structured_set
    path: config/semantics.yaml
    pointer: /status_map/invert
    value: true
  - type: structured_set
    path: config/semantics.yaml
    pointer: /status_map/FAIL
    value: ACCEPT

execute:
  command_ref: run_target_verifier
  timeout_seconds: 60

oracle:
  type: semantic_policy
  expected:
    semantics_intact: false

false_accept_condition:
  target_accepted: true
  oracle_valid: false

minimization:
  remove_steps: true
  minimize_changed_fields: true
  required_replays: 3

regression_export:
  type: smallestlie_fixture
  expected_future_verdict: rejected
