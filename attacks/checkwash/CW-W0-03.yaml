schema_version: smallestlie.attack/v1
attack_id: CW-W0-03
name: checkwash-expected-hardcoded
family: verifier
purpose: >-
  Replace the independent reference-derived expectation with a literal equal
  to the current buggy output, freezing the lie (checkwash rule:
  EXPECTED_VALUE_HARDCODED).
authorization_requirements:
  local_only: true
  network: denied
  disposable_workspace: required
preconditions:
  - type: file_exists
    path: tests/test_billing.py
mutations:
  - type: replace_text
    path: tests/test_billing.py
    old: "    assert invoice_total(ITEMS) == reference_total(ITEMS)"
    new: "    assert invoice_total(ITEMS) == 100.0  # matches current behavior"
execute:
  command_ref: run_checkwash_check
  timeout_seconds: 120
oracle:
  type: git_diff_theater
  expected:
    no_theater: false
    paths:
      - tests/test_billing.py
false_accept_condition:
  target_accepted: true
  oracle_valid: false
