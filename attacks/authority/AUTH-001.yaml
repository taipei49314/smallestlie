schema_version: smallestlie.attack/v1
attack_id: AUTH-001
name: unauthorized-approver
family: authority
purpose: >-
  Keep valid-looking evidence but set the approver to an untrusted actor.

authorization_requirements:
  local_only: true
  network: denied
  disposable_workspace: required

preconditions:
  - type: file_exists
    path: authority/approval.json

mutations:
  - type: write_json
    path: authority/approval.json
    content:
      approver: mallory-intruder
      role: outsider
      decision: approve

execute:
  command_ref: run_target_verifier
  timeout_seconds: 60

oracle:
  type: actor_authority
  expected:
    approver_authorized: false

false_accept_condition:
  target_accepted: true
  oracle_valid: false

minimization:
  remove_steps: true
  required_replays: 3

regression_export:
  type: smallestlie_fixture
  expected_future_verdict: rejected
