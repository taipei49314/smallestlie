# Nightly automatic campaigns against known synthetic fixtures only.
# schedule: 02:17 UTC daily (stable off-peak offset)
name: smallestlie-nightly

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  nightly-fixtures:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.4"

      - name: Setup Python
        run: uv python install 3.12

      - name: Sync
        run: uv sync --extra dev

      - name: Doctor
        run: uv run smallestlie doctor

      - name: Nightly fixture campaigns
        id: nightly
        run: |
          set +e
          uv run smallestlie nightly \
            --budget-seconds 7000 \
            --output outputs/nightly
          code=$?
          set -e
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          report=""
          for candidate in outputs/nightly/*/batch-report.md; do
            if [ -f "$candidate" ] && { [ -z "$report" ] || [ "$candidate" -nt "$report" ]; }; then
              report="$candidate"
            fi
          done
          if [ -n "$report" ]; then
            echo "## Nightly fixtures" >> "$GITHUB_STEP_SUMMARY"
            cat "$report" >> "$GITHUB_STEP_SUMMARY"
          fi
          # 0 ok; 3 soft ok for schedule noise; 2/4/5 fail
          if [ "$code" -eq 0 ] || [ "$code" -eq 3 ]; then exit 0; fi
          exit "$code"

      - name: Measure
        if: always()
        run: |
          set +e
          uv run smallestlie measure --output outputs/measurements
          mcode=$?
          set -e
          if [ -f outputs/measurements/measurement-report.md ]; then
            echo "" >> "$GITHUB_STEP_SUMMARY"
            cat outputs/measurements/measurement-report.md >> "$GITHUB_STEP_SUMMARY"
          fi
          # Integrity: unexpected measure exit codes fail the job.
          if [ "$mcode" -ne 0 ] && [ "$mcode" -ne 3 ]; then
            echo "unexpected measure exit: $mcode"
            exit "$mcode"
          fi
          exit 0

      - name: Upload nightly artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: smallestlie-nightly-${{ github.run_id }}
          path: |
            outputs/nightly/
            outputs/measurements/
          if-no-files-found: warn
