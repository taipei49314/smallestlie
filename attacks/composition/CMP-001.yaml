schema_version: smallestlie.attack/v1
attack_id: CMP-001
name: rename-escape-plus-stale-evidence
family: composition
purpose: >-
  SEQUENCE of path identity loss and stale evidence. On composition_blind_gate,
  each parent alone is rejected; together the legacy projector false-accepts.

parents:
  - PATH-002
  - EVD-002

authorization_requirements:
  local_only: true
  network: denied
  disposable_workspace: required

preconditions:
  - type: file_exists
    path: protected/required_check.py
  - type: file_exists
    path: evidence/evidence.json

mutations:
  - type: rename_path
    from: protected/required_check.py
    to: protected/required_check.py.bak
  - type: write_text
    path: decoy/required_check.py
    content: |
      # decoy leaf — missing REQUIRED_SEMANTIC_CHECK_V1
      def check():
          return False
  - type: write_json
    path: evidence/evidence.json
    content:
      target_revision: rev-A
      status: PASS
      producer: compound-stale
      note: stale evidence combined with path escape

execute:
  command_ref: run_target_verifier
  timeout_seconds: 60

oracle:
  type: composite
  plugins:
    - type: path_canonicalization
      expected:
        canonical_identity_intact: false
    - type: revision_binding
      expected:
        evidence_revision_matches: false

false_accept_condition:
  target_accepted: true
  oracle_valid: false

minimization:
  remove_steps: true
  required_replays: 3
  compound: true

regression_export:
  type: smallestlie_fixture
  expected_future_verdict: rejected

composition:
  form: SEQUENCE
  depth: 2
  lineage:
    left: PATH-002
    right: EVD-002
