schema_version: smallestlie.attack/v1
attack_id: GW-PROJ-005
name: greenwash-exit-report-channel-disagreement
family: projection
purpose: >-
  Force clean classification in report while exit code is non-zero (or reverse
  pressure) and check whether the accepting channel still wins.

authorization_requirements:
  local_only: true
  network: denied
  disposable_workspace: required

preconditions:
  - type: file_exists
    path: package/subject.json

mutations:
  - type: write_json
    path: package/subject.json
    content:
      revision: rev-B
      current_revision: rev-B
      artifact_id: art-001
      force_channel_disagree: true

execute:
  command_ref: run_greenwash_audit
  timeout_seconds: 60

oracle:
  type: theater_presence
  expected:
    no_theater: false

false_accept_condition:
  target_accepted: true
  oracle_valid: false

minimization:
  remove_steps: true
  required_replays: 3
