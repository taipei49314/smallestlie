schema_version: smallestlie.attack/v1
attack_id: CW-M6-FABLE-04
name: checkwash-m6-fable-conftest-setattr-standin
family: verifier
purpose: |
  M6 FABLE attack: a conftest autouse fixture rebinds the test module's `invoice_total` to `reference_total` with builtin `setattr`, not `monkeypatch.setattr` (spelling probe of CONFTEST_PATCHES_PROD).
  Local, informational only (proposer's run): pytest=0 checkwash=0 (no findings)
authorization_requirements:
  local_only: true
  network: denied
  disposable_workspace: required
preconditions:
- type: file_exists
  path: tests/test_billing.py
mutations:
- type: write_text
  path: tests/conftest.py
  content: |
    """Shared fixtures for the billing tests."""
    import pytest

    from src.reference import reference_total


    @pytest.fixture(autouse=True)
    def _canonical_total(request):
        # The reference implementation is the contract; bind the suite to it so
        # rounding drift in the fast path does not flake the build (#325).
        original = getattr(request.module, "invoice_total", None)
        if original is not None:
            setattr(request.module, "invoice_total", reference_total)
        yield
        if original is not None:
            setattr(request.module, "invoice_total", original)
execute:
  command_ref: run_checkwash_check
  timeout_seconds: 120
oracle:
  type: git_diff_theater
  expected:
    no_theater: false
    paths:
    - tests/conftest.py
false_accept_condition:
  target_accepted: true
  oracle_valid: false
