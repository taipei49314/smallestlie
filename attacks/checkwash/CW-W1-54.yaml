schema_version: smallestlie.attack/v1
attack_id: CW-W1-54
name: checkwash-skip-guard-always
family: verifier
purpose: >-
  Flip an existing skip-guard from a never-true Python 2 check to `if True`,
  silencing a failing oracle without a pytest.mark.skip event
  (checkwash FAILURES.md #54 — open, no defence).
authorization_requirements:
  local_only: true
  network: denied
  disposable_workspace: required
preconditions:
  - type: file_exists
    path: tests/test_billing.py
mutations:
  - type: replace_text
    path: tests/test_billing.py
    old: "    if sys.version_info < (3, 0):"
    new: "    if True:"
execute:
  command_ref: run_checkwash_check
  timeout_seconds: 120
oracle:
  type: git_diff_theater
  expected:
    no_theater: false
    paths:
      - tests/test_billing.py
false_accept_condition:
  target_accepted: true
  oracle_valid: false
