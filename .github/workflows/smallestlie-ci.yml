# SmallestLie offline CI gate (synthetic fixtures only).
# Never treats skipped/blocked as pass. Does not claim "secure".
name: smallestlie-ci

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

jobs:
  # Fast path: subset catalog + unit tests
  offline-gate-fast:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Setup Python
        run: uv python install 3.12

      - name: Sync
        run: uv sync --extra dev

      - name: Doctor
        run: uv run smallestlie doctor

      - name: Unit + policy + integration tests
        run: uv run pytest -q

      - name: CI gate (fast catalog)
        id: gate
        run: |
          set +e
          uv run smallestlie ci-gate \
            --budget-seconds 900 \
            --output outputs/ci-fast \
            --artifact-dir artifacts/smallestlie-fast
          code=$?
          set -e
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          if [ -f outputs/ci-fast/ci-summary.md ]; then
            echo "## Fast gate" >> "$GITHUB_STEP_SUMMARY"
            cat outputs/ci-fast/ci-summary.md >> "$GITHUB_STEP_SUMMARY"
          fi
          exit $code

      - name: Upload fast artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smallestlie-ci-fast-${{ github.run_id }}
          path: artifacts/smallestlie-fast/
          if-no-files-found: warn

  # Full M1 (+ VRF) catalog — closes ci.fast_catalog_incomplete_m1 blind spot
  offline-gate-full:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Setup Python
        run: uv python install 3.12

      - name: Sync
        run: uv sync --extra dev

      - name: CI gate (full catalog)
        id: gate_full
        run: |
          set +e
          uv run smallestlie ci-gate \
            --full \
            --budget-seconds 2400 \
            --output outputs/ci-full \
            --artifact-dir artifacts/smallestlie-full
          code=$?
          set -e
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          if [ -f outputs/ci-full/ci-summary.md ]; then
            echo "## Full catalog gate" >> "$GITHUB_STEP_SUMMARY"
            cat outputs/ci-full/ci-summary.md >> "$GITHUB_STEP_SUMMARY"
          fi
          exit $code

      - name: Upload full artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smallestlie-ci-full-${{ github.run_id }}
          path: artifacts/smallestlie-full/
          if-no-files-found: warn

  measure:
    runs-on: ubuntu-latest
    needs: [offline-gate-fast, offline-gate-full]
    if: always()
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Setup Python
        run: uv python install 3.12

      - name: Sync
        run: uv sync --extra dev

      - name: Measure + blindspots
        run: |
          set +e
          uv run smallestlie measure --output outputs/measurements
          mcode=$?
          uv run smallestlie blindspots --report outputs/measurements/measurement-report.json
          bcode=$?
          set -e
          if [ -f outputs/measurements/measurement-report.md ]; then
            cat outputs/measurements/measurement-report.md >> "$GITHUB_STEP_SUMMARY"
          fi
          # Hard measure fail only
          if [ "$mcode" -eq 2 ]; then exit 2; fi
          # High blind spots fail (blindspots exit 2)
          if [ "$bcode" -eq 2 ]; then exit 2; fi
          exit 0

      - name: Upload measurement artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smallestlie-measure-${{ github.run_id }}
          path: outputs/measurements/
          if-no-files-found: warn
