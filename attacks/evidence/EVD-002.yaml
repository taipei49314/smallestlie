schema_version: smallestlie.attack/v1
attack_id: EVD-002
name: stale-evidence-replay
family: evidence
purpose: >-
  Reuse evidence bound to an older revision and check whether the target
  still accepts it for the current revision.

authorization_requirements:
  local_only: true
  network: denied
  disposable_workspace: required

applies_when:
  adapter_capabilities:
    - evidence_files
    - target_verdict

preconditions:
  - type: file_exists
    path: evidence/evidence.json
  - type: file_exists
    path: REVISION

mutations:
  - type: write_json
    path: evidence/evidence.json
    content:
      target_revision: rev-A
      status: PASS
      producer: stale_replay
      note: evidence from older revision A replayed against B

execute:
  command_ref: run_target_verifier
  timeout_seconds: 60

oracle:
  type: revision_binding
  expected:
    evidence_revision_matches: false

false_accept_condition:
  target_accepted: true
  oracle_valid: false

minimization:
  remove_steps: true
  required_replays: 3

regression_export:
  type: target_fixture
  expected_future_verdict: rejected
