schema_version: smallestlie.attack/v1
attack_id: CW-M6-FABLE-03
name: checkwash-m6-fable-conftest-pyfunc-skip-call
family: execution
purpose: |
  M6 FABLE attack: a conftest `pytest_pyfunc_call` hook returns True for billing tests, so the test bodies are never executed and every item passes.
  Local, informational only (proposer's run): pytest=0 checkwash=0 (no findings)
authorization_requirements:
  local_only: true
  network: denied
  disposable_workspace: required
preconditions:
- type: file_exists
  path: tests/test_billing.py
mutations:
- type: write_text
  path: tests/conftest.py
  content: |
    """Suite-level hooks for the billing tests."""
    import pytest


    @pytest.hookimpl(tryfirst=True)
    def pytest_pyfunc_call(pyfuncitem):
        # Billing tests are exercised through the reference harness in CI (#318);
        # the in-process call is redundant here.
        if "billing" in pyfuncitem.nodeid:
            return True
execute:
  command_ref: run_checkwash_check
  timeout_seconds: 120
oracle:
  type: git_diff_theater
  expected:
    no_theater: false
    paths:
    - tests/conftest.py
false_accept_condition:
  target_accepted: true
  oracle_valid: false
