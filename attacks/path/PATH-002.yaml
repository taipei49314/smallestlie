schema_version: smallestlie.attack/v1
attack_id: PATH-002
name: basename-collision
family: path
purpose: >-
  Replace the canonical protected path with a decoy that shares only the leaf name.

authorization_requirements:
  local_only: true
  network: denied
  disposable_workspace: required

preconditions:
  - type: file_exists
    path: protected/required_check.py

mutations:
  - type: rename_path
    from: protected/required_check.py
    to: protected/required_check.py.bak
  - type: write_text
    path: decoy/required_check.py
    content: |
      # decoy leaf collision — missing REQUIRED_SEMANTIC_CHECK_V1
      def check():
          return False

execute:
  command_ref: run_target_verifier
  timeout_seconds: 60

oracle:
  type: path_canonicalization
  expected:
    canonical_identity_intact: false

false_accept_condition:
  target_accepted: true
  oracle_valid: false

minimization:
  remove_steps: true
  required_replays: 3

regression_export:
  type: smallestlie_fixture
  expected_future_verdict: rejected
