schema_version: smallestlie.attack/v1
attack_id: EXE-001
name: partial-run-as-full-run
family: execution
purpose: >-
  Execute only a subset of required tests/jobs while preserving an aggregate
  success claim for the full matrix.

authorization_requirements:
  local_only: true
  network: denied
  disposable_workspace: required

preconditions:
  - type: file_exists
    path: config/execution.yaml
  - type: file_exists
    path: tests/test_required.py

mutations:
  - type: structured_set
    path: config/execution.yaml
    pointer: /run_only
    value:
      - test_required

execute:
  command_ref: run_target_verifier
  timeout_seconds: 60

oracle:
  type: matrix_completeness
  expected:
    full_matrix_executed: false

false_accept_condition:
  target_accepted: true
  oracle_valid: false

minimization:
  remove_steps: true
  required_replays: 3

regression_export:
  type: smallestlie_fixture
  expected_future_verdict: rejected
