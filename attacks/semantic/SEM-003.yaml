schema_version: smallestlie.attack/v1
attack_id: SEM-003
name: boolean-default-inversion
family: semantic
purpose: >-
  Remove a critical deny-by-default policy field so missing becomes allow.

authorization_requirements:
  local_only: true
  network: denied
  disposable_workspace: required

preconditions:
  - type: file_exists
    path: gate_policy.yaml

mutations:
  - type: structured_delete
    path: gate_policy.yaml
    pointer: /require_approval

execute:
  command_ref: run_target_verifier
  timeout_seconds: 60

oracle:
  type: fail_closed_defaults
  expected:
    defaults_fail_closed: false

false_accept_condition:
  target_accepted: true
  oracle_valid: false

minimization:
  remove_steps: true
  required_replays: 3

regression_export:
  type: smallestlie_fixture
  expected_future_verdict: rejected
