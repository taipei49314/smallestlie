schema_version: smallestlie.attack/v1
attack_id: TIME-001
name: revision-after-evidence
family: freshness
purpose: >-
  Change the target revision after evidence was generated for an older revision.

authorization_requirements:
  local_only: true
  network: denied
  disposable_workspace: required

preconditions:
  - type: file_exists
    path: REVISION
  - type: file_exists
    path: evidence/evidence.json

mutations:
  - type: write_text
    path: REVISION
    content: "rev-C\n"
  # evidence remains bound to rev-B (or write explicitly)
  - type: write_json
    path: evidence/evidence.json
    content:
      target_revision: rev-B
      status: PASS
      producer: pre-change-evidence
      note: evidence predates revision C

execute:
  command_ref: run_target_verifier
  timeout_seconds: 60

oracle:
  type: revision_binding
  expected:
    evidence_revision_matches: false

false_accept_condition:
  target_accepted: true
  oracle_valid: false

minimization:
  remove_steps: true
  required_replays: 3

regression_export:
  type: smallestlie_fixture
  expected_future_verdict: rejected
