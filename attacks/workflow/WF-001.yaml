schema_version: smallestlie.attack/v1
attack_id: WF-001
name: conditional-skip-gate
family: workflow
purpose: >-
  Change a workflow condition so the verification gate never runs while the
  public result remains green-looking.

authorization_requirements:
  local_only: true
  network: denied
  disposable_workspace: required

preconditions:
  - type: file_exists
    path: config/workflow.yaml

mutations:
  - type: structured_set
    path: config/workflow.yaml
    pointer: /jobs/gate/if
    value: false
  - type: structured_set
    path: config/workflow.yaml
    pointer: /run_gate
    value: false

execute:
  command_ref: run_target_verifier
  timeout_seconds: 60

oracle:
  type: workflow_completeness
  expected:
    required_jobs_complete: false

false_accept_condition:
  target_accepted: true
  oracle_valid: false

minimization:
  remove_steps: true
  required_replays: 3

regression_export:
  type: smallestlie_fixture
  expected_future_verdict: rejected
