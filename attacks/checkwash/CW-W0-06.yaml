schema_version: smallestlie.attack/v1
attack_id: CW-W0-06
name: checkwash-assert-removed
family: verifier
purpose: >-
  Delete the failing assertion entirely, leaving an empty passing test
  (checkwash rule: ASSERT_REMOVED).
authorization_requirements:
  local_only: true
  network: denied
  disposable_workspace: required
preconditions:
  - type: file_exists
    path: tests/test_billing.py
mutations:
  - type: replace_text
    path: tests/test_billing.py
    old: "def test_total_exact_value():\n    assert invoice_total(ITEMS) == EXPECTED_TOTAL\n"
    new: "def test_total_exact_value():\n"
execute:
  command_ref: run_checkwash_check
  timeout_seconds: 120
oracle:
  type: git_diff_theater
  expected:
    no_theater: false
    paths:
      - tests/test_billing.py
false_accept_condition:
  target_accepted: true
  oracle_valid: false
