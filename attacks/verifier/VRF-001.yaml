schema_version: smallestlie.attack/v1
attack_id: VRF-001
name: verifier-rule-deletion-with-stale-evidence
family: verifier
purpose: >-
  Delete (disable) a critical verification rule in the verifier fixture and
  replay stale evidence, checking whether the weakened verifier still accepts.

authorization_requirements:
  local_only: true
  network: denied
  disposable_workspace: required

preconditions:
  - type: file_exists
    path: fixture_gate/verify.py
  - type: file_exists
    path: evidence/evidence.json
  - type: file_exists
    path: REVISION

mutations:
  # Disable evidence-revision binding rule inside the verifier (VRF rule deletion).
  - type: replace_text
    path: fixture_gate/verify.py
    old: "if policy.get(\"bind_evidence_revision\", True):"
    new: "if False and policy.get(\"bind_evidence_revision\", True):  # VRF-001 rule deleted"
    expected_count: 1
  # Invalidate evidence relative to current REVISION.
  - type: write_json
    path: evidence/evidence.json
    content:
      target_revision: rev-A
      status: PASS
      producer: vrf-001-stale
      note: evidence predates rule deletion and revision B

execute:
  command_ref: run_target_verifier
  timeout_seconds: 60

oracle:
  type: composite
  plugins:
    - type: revision_binding
      expected:
        evidence_revision_matches: false
    - type: verifier_rule_presence
      expected:
        required_rules_intact: false

false_accept_condition:
  target_accepted: true
  oracle_valid: false

minimization:
  remove_steps: true
  required_replays: 3

regression_export:
  type: smallestlie_fixture
  expected_future_verdict: rejected
