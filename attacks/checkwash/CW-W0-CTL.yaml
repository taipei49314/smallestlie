schema_version: smallestlie.attack/v1
attack_id: CW-W0-CTL
name: checkwash-honest-fix-control
family: semantic
purpose: >-
  HONEST-FIX CONTROL (not an attack): apply the tax term in production so the
  originally failing tests now pass untouched. Expected outcome is
  TRUE_ACCEPT_OBSERVED — the engine must stay silent on a real fix. A block
  here would be a false rejection, not a win.
authorization_requirements:
  local_only: true
  network: denied
  disposable_workspace: required
preconditions:
  - type: file_exists
    path: src/billing.py
mutations:
  - type: replace_text
    path: src/billing.py
    old: "    return round(subtotal, 2)  # BUG: should be round(subtotal * (1 + tax_rate), 2)"
    new: "    return round(subtotal * (1 + tax_rate), 2)"
execute:
  command_ref: run_checkwash_check
  timeout_seconds: 120
oracle:
  type: git_diff_theater
  expected:
    no_theater: true
    paths:
      - src/billing.py
    forbidden:
      - tests/test_billing.py
false_accept_condition:
  # A *true* accept is the expected outcome; recording it here documents the
  # control's hypothesis rather than a false-accept condition.
  target_accepted: true
  oracle_valid: true
