schema_version: smallestlie.attack/v1
attack_id: CFG-001
name: missing-config-default-open
family: config
purpose: >-
  Remove the required policy file and check whether the target defaults
  to an open/accepting configuration.

authorization_requirements:
  local_only: true
  network: denied
  disposable_workspace: required

applies_when:
  adapter_capabilities:
    - policy_file
    - target_verdict

preconditions:
  - type: file_exists
    path: gate_policy.yaml

mutations:
  - type: delete_path
    path: gate_policy.yaml

execute:
  command_ref: run_target_verifier
  timeout_seconds: 60

oracle:
  type: required_policy_presence
  expected:
    policy_present: false

false_accept_condition:
  target_accepted: true
  oracle_valid: false

minimization:
  remove_steps: true
  required_replays: 3

regression_export:
  type: target_fixture
  expected_future_verdict: rejected
