schema_version: smallestlie.attack/v1
attack_id: EVD-003
name: artifact-hash-mismatch
family: evidence
purpose: >-
  Modify artifact bytes while preserving old manifest hash metadata.

authorization_requirements:
  local_only: true
  network: denied
  disposable_workspace: required

preconditions:
  - type: file_exists
    path: artifacts/build.bin
  - type: file_exists
    path: artifacts/manifest.json

mutations:
  - type: write_text
    path: artifacts/build.bin
    content: "TAMPERED-ARTIFACT-BYTES\n"

execute:
  command_ref: run_target_verifier
  timeout_seconds: 60

oracle:
  type: artifact_hash_binding
  expected:
    artifact_matches_manifest: false

false_accept_condition:
  target_accepted: true
  oracle_valid: false

minimization:
  remove_steps: true
  required_replays: 3

regression_export:
  type: smallestlie_fixture
  expected_future_verdict: rejected
